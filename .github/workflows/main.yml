name: Main Formaslov workflow

on:
  push:
    branches:
      - master

jobs:
  backend_test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: formaslov_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r backend/requirements.txt 
          pip install flake8

      - name: Check legacy backend with flake8
        run: python -m flake8 backend/

      - name: Test legacy Django backend
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "False"
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: formaslov_test
          DB_HOST: localhost
          DB_PORT: "5432"
          ALLOWED_HOSTS: localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
        run: |
          cd backend/
          python manage.py test

      - name: Test FastAPI backend
        env:
          SECRET_KEY: test-secret-key
          DATABASE_URL: postgresql+asyncpg://django_user:django_password@localhost:5432/formaslov_test
          TEST_DATABASE_URL: postgresql+asyncpg://django_user:django_password@localhost:5432/formaslov_test
          TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          alembic upgrade head
          python -m pytest tests -q
  
  build_backend_and_push_to_docker_hub:
    name: Push backend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: backend_test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/formaslov_backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/formaslov_backend:latest
    
  frontend_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up nodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend/
          npm ci --legacy-peer-deps
          CI=true npm test -- --watchAll=false
  
  build_frontend_and_push_to_docker_hub:
    name: Push frontend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: frontend_tests

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/
          push: true
          build-args: |
            REACT_APP_API_URL=/api/v1/
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/formaslov_frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/formaslov_frontend:latest
  
  build_gateway_and_push_to_docker_hub:
    name: Push gateway Docker image to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: ./nginx/
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/formaslov_gateway:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/formaslov_gateway:latest
  
  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - build_backend_and_push_to_docker_hub
      - build_frontend_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare rollback state
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /opt/projects/formaslov/
            if [ -f .current-image-tag ]; then
              cp .current-image-tag .previous-image-tag
            fi
            if [ -f docker-compose.yml ]; then
              cp docker-compose.yml docker-compose.previous.yml
            fi
            if [ ! -f docker-compose.legacy.yml ]; then
              cp docker-compose.yml docker-compose.legacy.yml
              backend_image=$(docker compose -f docker-compose.yml images -q backend)
              frontend_image=$(docker compose -f docker-compose.yml images -q frontend)
              gateway_image=$(docker compose -f docker-compose.yml images -q gateway)
              test -n "$backend_image"
              test -n "$frontend_image"
              test -n "$gateway_image"
              docker image tag "$backend_image" formaslov_backend:pre-fastapi
              docker image tag "$frontend_image" formaslov_frontend:pre-fastapi
              docker image tag "$gateway_image" formaslov_gateway:pre-fastapi
              sed -i \
                -e 's#image: .*formaslov_backend:latest#image: formaslov_backend:pre-fastapi#' \
                -e 's#image: .*formaslov_frontend:latest#image: formaslov_frontend:pre-fastapi#' \
                -e 's#image: .*formaslov_gateway:latest#image: formaslov_gateway:pre-fastapi#' \
                docker-compose.legacy.yml
            fi
      
      - name: Copy docker-compose.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "infra/docker-compose.yml"
          target: "/opt/projects/formaslov/"
          strip_components: 1
          overwrite: true

      - name: Deploy FastAPI backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /opt/projects/formaslov/
            IMAGE_TAG=${{ github.sha }}
            env IMAGE_TAG="$IMAGE_TAG" docker compose config --quiet
            env IMAGE_TAG="$IMAGE_TAG" docker compose pull
            env IMAGE_TAG="$IMAGE_TAG" docker compose up -d --wait db redis rabbitmq
            env IMAGE_TAG="$IMAGE_TAG" docker compose run --rm backend alembic upgrade head
            env IMAGE_TAG="$IMAGE_TAG" docker compose up -d --wait backend celery-worker
            env IMAGE_TAG="$IMAGE_TAG" docker compose exec -T backend \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
            env IMAGE_TAG="$IMAGE_TAG" docker compose up -d frontend gateway
            env IMAGE_TAG="$IMAGE_TAG" docker compose exec -T gateway \
              wget -qO- http://127.0.0.1/health
            env IMAGE_TAG="$IMAGE_TAG" docker compose exec -T gateway \
              sh -c 'set -- $NGINX_SERVER_NAME; wget -qO- "https://$1/health"'
            printf '%s\n' "$IMAGE_TAG" > .current-image-tag
  
  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps: 
      - name: send_message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Деплой Formaslov выполнен успешно!
            Автор: ${{ github.actor }}
            Коммит: ${{ github.event.commits[0].message }} https://github.com/${{ github.repository }}/commit/${{ github.sha }}
