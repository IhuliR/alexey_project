openapi: 3.0.3
info:
  title: Formaslov API
  version: "1.0"
  description: REST API для документов, пользовательских меток и текстовых аннотаций.
security:
  - bearerAuth: []
paths:
  /api/v1/users/:
    post:
      tags: [Auth]
      summary: Зарегистрировать пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredUser"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users/me/:
    get:
      tags: [Auth]
      summary: Получить текущего пользователя
      responses:
        "200":
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/set_password/:
    post:
      tags: [Auth]
      summary: Изменить пароль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Пароль изменён
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/jwt/create/:
    post:
      tags: [Auth]
      summary: Получить access и refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenObtain"
      responses:
        "200":
          description: Пара JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/jwt/refresh/:
    post:
      tags: [Auth]
      summary: Обновить access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
      responses:
        "200":
          description: Новый access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/jwt/verify/:
    post:
      tags: [Auth]
      summary: Проверить token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenVerify"
      responses:
        "200":
          description: Token валиден
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/documents/:
    get:
      tags: [Documents]
      summary: Получить документы пользователя
      description: Без limit возвращает массив. Если limit передан, возвращает объект LimitOffsetPagination.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Список документов
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/TextDocument"
                  - $ref: "#/components/schemas/PaginatedDocuments"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Documents]
      summary: Создать документ
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TextDocumentCreate"
      responses:
        "201":
          description: Документ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextDocument"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/documents/{id}/:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Documents]
      summary: Получить документ
      responses:
        "200":
          description: Документ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Documents]
      summary: Полностью обновить документ
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TextDocumentCreate"
      responses:
        "200":
          description: Документ обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextDocument"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Documents]
      summary: Частично обновить документ
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TextDocumentPatch"
      responses:
        "200":
          description: Документ обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextDocument"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Documents]
      summary: Удалить документ
      responses:
        "204":
          description: Документ удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/documents/upload/:
    post:
      tags: [Documents]
      summary: Создать документ из UTF-8 .txt
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Документ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextDocument"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/documents/{id}/chunks/:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Documents]
      summary: Получить страницу chunks документа
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Chunks и абсолютные offsets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/labels/:
    get:
      tags: [Labels]
      summary: Получить метки пользователя
      responses:
        "200":
          description: Список меток
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Labels]
      summary: Создать метку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelWrite"
      responses:
        "201":
          description: Метка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/labels/{id}/:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Labels]
      summary: Получить метку
      responses:
        "200":
          description: Метка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Labels]
      summary: Полностью обновить метку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelWrite"
      responses:
        "200":
          description: Метка обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Labels]
      summary: Частично обновить метку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelPatch"
      responses:
        "200":
          description: Метка обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Labels]
      summary: Удалить метку
      responses:
        "204":
          description: Метка удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Метка используется annotations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelInUseError"
  /api/v1/annotations/:
    get:
      tags: [Annotations]
      summary: Получить аннотации пользователя
      parameters:
        - name: document
          in: query
          required: false
          description: ID документа
          schema:
            type: integer
      responses:
        "200":
          description: Список аннотаций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Annotation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Annotations]
      summary: Создать аннотацию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationWrite"
      responses:
        "201":
          description: Аннотация создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/annotations/{id}/:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Annotations]
      summary: Получить аннотацию
      responses:
        "200":
          description: Аннотация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Annotations]
      summary: Полностью обновить аннотацию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationWrite"
      responses:
        "200":
          description: Аннотация обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Annotations]
      summary: Частично обновить аннотацию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationPatch"
      responses:
        "200":
          description: Аннотация обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Annotations]
      summary: Удалить аннотацию
      responses:
        "204":
          description: Аннотация удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: JWT отсутствует или невалиден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"
    NotFound:
      description: Объект не существует или недоступен пользователю
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"
  schemas:
    UserCreate:
      type: object
      required: [username, password]
      properties:
        email:
          type: string
        username:
          type: string
          maxLength: 150
        password:
          type: string
          format: password
          writeOnly: true
    RegisteredUser:
      type: object
      required: [email, username, id]
      properties:
        email:
          type: string
        username:
          type: string
          maxLength: 150
        id:
          type: integer
          readOnly: true
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          maxLength: 150
    PasswordChange:
      type: object
      required: [current_password, new_password, re_new_password]
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
        new_password:
          type: string
          format: password
          writeOnly: true
        re_new_password:
          type: string
          format: password
          writeOnly: true
    TokenObtain:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          format: password
          writeOnly: true
    TokenPair:
      type: object
      required: [access, refresh]
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
    TokenRefresh:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    AccessToken:
      type: object
      required: [access]
      properties:
        access:
          type: string
          readOnly: true
    TokenVerify:
      type: object
      required: [token]
      properties:
        token:
          type: string
          writeOnly: true
    TextDocument:
      type: object
      required: [id, user, title, slug, original_filename, content, created_at]
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          readOnly: true
        original_filename:
          type: string
          maxLength: 255
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    TextDocumentCreate:
      type: object
      required: [content]
      properties:
        title:
          type: string
          maxLength: 255
        original_filename:
          type: string
          maxLength: 255
        content:
          type: string
    TextDocumentPatch:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        original_filename:
          type: string
          maxLength: 255
        content:
          type: string
    PaginatedDocuments:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/TextDocument"
    ChunkPage:
      type: object
      required:
        - document_id
        - page
        - page_size
        - has_next
        - has_prev
        - total_chunks
        - chunk
        - chunk_index
        - chunk_start
        - chunk_end
      properties:
        document_id:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
        total_chunks:
          type: integer
        chunk:
          type: array
          items:
            type: string
        chunk_index:
          type: integer
          nullable: true
        chunk_start:
          type: integer
          nullable: true
        chunk_end:
          type: integer
          nullable: true
    Label:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        color:
          type: string
          maxLength: 7
          default: "#ffff00"
    LabelWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        color:
          type: string
          maxLength: 7
          default: "#ffff00"
    LabelPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        color:
          type: string
          maxLength: 7
    Annotation:
      type: object
      required: [id, document, label, start, end, text, created_at]
      properties:
        id:
          type: integer
          readOnly: true
        document:
          type: integer
        label:
          type: integer
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        text:
          type: string
          maxLength: 500
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    AnnotationWrite:
      type: object
      required: [document, label, start, end]
      properties:
        document:
          type: integer
        label:
          type: integer
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    AnnotationPatch:
      type: object
      properties:
        document:
          type: integer
        label:
          type: integer
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    LabelInUseError:
      type: object
      required: [detail, code, annotations_count]
      properties:
        detail:
          type: string
        code:
          type: string
          enum: [label_in_use]
        annotations_count:
          type: integer
          minimum: 1
    DetailError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    ApiError:
      type: object
      additionalProperties: true
